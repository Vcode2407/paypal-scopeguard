name: ScopeGuard checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scopeguard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install captured dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run workflow, provider and private-storage regression tests
        # Provider HTTP is stubbed. No sponsor credentials or account calls.
        # Windows runs the real NTFS DACL/ownership regression too.
        run: npm test
      - name: Reproduce the account-free local demo
        run: npm run demo:verify
